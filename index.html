<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para Ti 🌻💛 | Feliz 21 de Septiembre</title>
    <meta name="description" content="Una sorpresa especial e interactiva con flores amarillas y razones desde el corazón.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
        html{font-size:16px}

        body{
            font-family:'Inter',sans-serif;
            min-height:100vh;min-height:100dvh;
            overflow:hidden;
            background:#080b1a;
            color:#f0e6d3;
            display:flex;align-items:center;justify-content:center;
            position:relative;padding:1rem;
            user-select:none;-webkit-user-select:none;
        }

        /* ── BACKGROUND ── */
        .bg{
            position:fixed;inset:0;z-index:0;
            background:
                radial-gradient(ellipse 80% 50% at 20% 85%,rgba(255,193,7,.08) 0%,transparent 60%),
                radial-gradient(ellipse 60% 60% at 80% 15%,rgba(255,152,0,.05) 0%,transparent 50%),
                radial-gradient(ellipse 70% 50% at 50% 50%,rgba(255,214,0,.04) 0%,transparent 65%),
                linear-gradient(180deg,#080b1a 0%,#0c102c 40%,#090d24 70%,#080b1a 100%);
        }

        /* ── STARS ── */
        .stars{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
        .star{position:absolute;background:rgba(255,255,255,.35);border-radius:50%;animation:twink var(--d) ease-in-out infinite alternate}
        @keyframes twink{0%{opacity:.15;transform:scale(1)}100%{opacity:.8;transform:scale(1.4)}}

        /* ── FALLING PETALS (INFINITE RAIN) ── */
        .rain{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
        .fp{position:absolute;top:-50px;opacity:0;will-change:transform,opacity}
        .fp svg{filter:drop-shadow(0 2px 6px rgba(255,193,7,.25))}
        .fp.go{animation:fall var(--t) var(--w) ease-in-out forwards}
        @keyframes fall{
            0%{opacity:0;transform:translateY(0) translateX(0) rotate(0) scale(var(--s))}
            8%{opacity:var(--o)}
            50%{transform:translateY(50vh) translateX(calc(var(--dx)*.6)) rotate(calc(var(--r)*.5)) scale(var(--s))}
            90%{opacity:var(--o)}
            100%{opacity:0;transform:translateY(calc(100vh + 60px)) translateX(var(--dx)) rotate(var(--r)) scale(var(--s))}
        }

        /* ── SHARED CONTAINER & VIEWS ── */
        .view-container{
            position:relative;z-index:10;
            width:100%;
            display:flex;align-items:center;justify-content:center;
            min-height:85vh;
        }

        /* ── VISTA 1: PANTALLA INICIAL ── */
        .view-1{
            position:relative;
            width:100%;
            display:flex;flex-direction:column;align-items:center;justify-content:center;
            text-align:center;
            transition:opacity .7s cubic-bezier(.4,0,.2,1),transform .7s cubic-bezier(.4,0,.2,1);
            opacity:1;transform:scale(1) translateY(0);
        }
        .view-1.hide{
            opacity:0;pointer-events:none;
            transform:scale(.94) translateY(-24px);
        }

        .v1-card{
            position:relative;
            width:100%;max-width:540px;margin:0 auto;
            background:rgba(255,255,255,.04);
            backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
            border:1px solid rgba(255,214,0,.15);
            border-radius:28px;
            padding:2.8rem 2rem;
            box-shadow:0 12px 40px rgba(0,0,0,.5),0 0 60px rgba(255,214,0,.04),inset 0 1px 0 rgba(255,255,255,.08);
            overflow:hidden;
        }
        .v1-card::before{
            content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
            width:60%;height:1px;
            background:linear-gradient(90deg,transparent,rgba(255,214,0,.45),transparent);
        }
        .v1-card::after{
            content:'';position:absolute;bottom:-15%;left:50%;transform:translateX(-50%);
            width:75%;height:35%;
            background:radial-gradient(ellipse,rgba(255,214,0,.06),transparent 70%);
            pointer-events:none;
        }

        /* Sutiles flores decorativas en Vista 1 */
        .v1-flower-decor{
            display:flex;align-items:center;justify-content:center;gap:.75rem;
            margin-bottom:1.6rem;opacity:.9;
        }
        .v1-flower-decor svg{
            width:26px;height:26px;filter:drop-shadow(0 0 10px rgba(255,214,0,.4));
            animation:gentleSway 4s ease-in-out infinite alternate;
        }
        .v1-flower-decor svg:nth-child(2){width:36px;height:36px;animation-delay:.5s}
        .v1-flower-decor svg:nth-child(3){animation-delay:1s}

        @keyframes gentleSway{
            0%{transform:rotate(-6deg) scale(.96)}
            100%{transform:rotate(6deg) scale(1.04)}
        }

        .v1-text{
            font-family:'Playfair Display',serif;
            font-size:1.35rem;font-weight:600;
            line-height:1.75;
            color:#ffd700;
            text-shadow:0 0 24px rgba(255,214,0,.18);
            margin-bottom:2.2rem;
        }
        .v1-text .hi{
            color:#fff;font-style:italic;
            text-shadow:0 0 16px rgba(255,214,0,.4);
        }

        /* Botón elegante de interacción */
        .btn-discover{
            position:relative;
            display:inline-flex;align-items:center;justify-content:center;gap:.75rem;
            background:linear-gradient(135deg,rgba(255,214,0,.12) 0%,rgba(255,160,0,.08) 100%);
            border:1px solid rgba(255,214,0,.4);
            border-radius:50px;
            padding:.95rem 2.2rem;
            color:#fff7d6;
            font-family:'Inter',sans-serif;
            font-size:1rem;font-weight:500;letter-spacing:.02em;
            cursor:pointer;
            box-shadow:0 4px 20px rgba(255,193,7,.22),inset 0 1px 0 rgba(255,255,255,.2);
            backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
            transition:all .35s cubic-bezier(.175,.885,.32,1.275);
            outline:none;
        }
        .btn-discover:hover{
            transform:translateY(-2px) scale(1.03);
            background:linear-gradient(135deg,rgba(255,214,0,.22) 0%,rgba(255,160,0,.15) 100%);
            border-color:rgba(255,214,0,.7);
            box-shadow:0 8px 30px rgba(255,193,7,.38),inset 0 1px 0 rgba(255,255,255,.3);
            color:#fff;
        }
        .btn-discover:active{
            transform:translateY(1px) scale(.98);
        }
        .btn-discover .icon{
            font-size:1.2rem;
            filter:drop-shadow(0 0 6px rgba(255,214,0,.6));
            animation:heartbeat 2s infinite ease-in-out;
        }
        @keyframes heartbeat{
            0%,100%{transform:scale(1)}
            50%{transform:scale(1.2)}
        }

        /* ── VISTA 2: EL GIRASOL INTERACTIVO ── */
        .view-2{
            position:relative;
            width:100%;height:100%;
            display:none;flex-direction:column;align-items:center;justify-content:center;
            opacity:0;transform:scale(.95) translateY(24px);
            transition:opacity .8s cubic-bezier(.4,0,.2,1),transform .8s cubic-bezier(.4,0,.2,1);
        }
        .view-2.show{
            display:flex;
            opacity:1;transform:scale(1) translateY(0);
        }

        /* Contenedor del Girasol y Tallo */
        .v2-sunflower-stage{
            position:relative;
            width:100%;
            display:flex;flex-direction:column;align-items:center;
            min-height:78vh;
        }

        /* SVG del Girasol y Tallo */
        .v2-sunflower-svg{
            width:min(75vmin, 340px);
            height:min(75vmin, 340px);
            filter:drop-shadow(0 0 28px rgba(255,193,7,.4)) drop-shadow(0 0 60px rgba(255,152,0,.2));
            z-index:2;
            animation:sunflowerBloom 1.4s cubic-bezier(.16,1,.3,1) forwards, gentleBreeze 6s 1.4s ease-in-out infinite alternate;
            transform-origin:center 85%;
        }
        @keyframes sunflowerBloom{
            0%{transform:scale(.3) rotate(-20deg);opacity:0}
            60%{transform:scale(1.05) rotate(3deg);opacity:1}
            100%{transform:scale(1) rotate(0);opacity:1}
        }
        @keyframes gentleBreeze{
            0%{transform:rotate(-2deg)}
            100%{transform:rotate(2.5deg)}
        }

        /* Toast Alert */
        .toast{
            position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(50px);
            background:rgba(20,25,50,.85);border:1px solid rgba(255,214,0,.4);
            border-radius:30px;padding:.8rem 1.6rem;
            color:#fffdfa;font-family:'Inter',sans-serif;font-size:.95rem;font-weight:500;
            box-shadow:0 10px 30px rgba(0,0,0,.5);
            display:flex;align-items:center;gap:.6rem;
            opacity:0;pointer-events:none;z-index:9999;
            backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
            transition:opacity .4s ease,transform .4s cubic-bezier(.175,.885,.32,1.275);
        }
        .toast.show{
            opacity:1;transform:translateX(-50%) translateY(0);
        }

        /* ── Girasoles Pequeños ── */
        .small-sunflowers {
            position:absolute;inset:0;z-index:1;pointer-events:none;
        }
        .small-sf-wrap {
            position:absolute;width:200px;height:200px;
            margin-top:-100px;margin-left:-100px;
            opacity:0;
            animation: smallSfBloom 1.2s cubic-bezier(.16,1,.3,1) forwards, smallSfBreeze 6s ease-in-out infinite alternate;
        }
        .small-sf-flower {
            position:absolute;width:100%;height:100%;
            filter:drop-shadow(0 0 10px rgba(255,193,7,.25));
            z-index:2;
        }
        .small-sf-stem {
            position:absolute;width:50px;height:320px;
            top:100px;left:75px;
            z-index:1;
        }
        @keyframes smallSfBloom {
            0% { transform: scale(0) rotate(calc(var(--rot) - 30deg)); opacity:0; }
            60% { transform: scale(calc(var(--scale) * 1.1)) rotate(calc(var(--rot) + 5deg)); opacity:1; }
            100% { transform: scale(var(--scale)) rotate(var(--rot)); opacity:1; }
        }
        @keyframes smallSfBreeze {
            0% { transform: scale(var(--scale)) rotate(var(--rot)); }
            100% { transform: scale(var(--scale)) rotate(calc(var(--rot) + 8deg)); }
        }

        /* Tallo SVG que se extiende hacia abajo */
        .v2-stem-svg{
            position:absolute;
            top:min(45vmin, 200px);
            left:50%;
            transform:translateX(-50%);
            width:140px;
            height:calc(100% - min(45vmin, 200px));
            z-index:1;
            pointer-events:none;
        }
        .v2-stem-path{
            stroke-dasharray:600;stroke-dashoffset:600;
            animation:stemDraw 1.2s .2s ease-out forwards;
        }
        @keyframes stemDraw{to{stroke-dashoffset:0}}
        .v2-leaf{
            transform-box:fill-box;transform-origin:center;
            animation:leafPop .8s .8s cubic-bezier(.34,1.56,.64,1) forwards;
            opacity:0;transform:scale(0);
        }
        @keyframes leafPop{to{opacity:1;transform:scale(1)}}

        /* Tarjeta de Texto Dinámico superpuesta al tallo */
        .v2-quote-card{
            position:relative;
            z-index:4;
            width:92%;max-width:380px;
            margin-top:-10px;
            background:rgba(12,16,40,.75);
            backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
            border:1px solid rgba(255,214,0,.22);
            border-radius:20px;
            padding:1.4rem 1.2rem 1.5rem;
            text-align:center;
            box-shadow:0 12px 36px rgba(0,0,0,.6),0 0 50px rgba(255,214,0,.08),inset 0 1px 0 rgba(255,255,255,.1);
            display:flex;flex-direction:column;align-items:center;gap:1rem;
            transition:transform .4s ease,box-shadow .4s ease;
        }
        .v2-quote-card::before{
            content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
            width:50%;height:1px;
            background:linear-gradient(90deg,transparent,rgba(255,214,0,.5),transparent);
        }

        .v2-badge{
            display:inline-flex;align-items:center;gap:.4rem;
            background:rgba(255,214,0,.12);
            border:1px solid rgba(255,214,0,.3);
            border-radius:20px;
            padding:.25rem .7rem;
            font-size:.7rem;font-weight:600;
            color:#ffd700;letter-spacing:.08em;text-transform:uppercase;
        }

        /* Texto Dinámico con animación fadeInUp */
        .v2-quote-text{
            font-family:'Playfair Display',serif;
            font-size:1rem;font-weight:400;font-style:italic;
            line-height:1.6;
            color:#fffdfa;
            min-height:4rem;
            display:flex;align-items:center;justify-content:center;
            transition:opacity .25s ease,transform .25s ease;
        }
        .v2-quote-text.fade-out{
            opacity:0;transform:translateY(-10px);
        }
        .v2-quote-text.fade-in-up{
            animation:fadeInUp .5s cubic-bezier(.2,.8,.3,1) forwards;
        }
        @keyframes fadeInUp{
            0%{opacity:0;transform:translateY(14px)}
            100%{opacity:1;transform:translateY(0)}
        }

        /* Botón de Ciclo "Leer otra" */
        .btn-cycle{
            position:relative;
            display:inline-flex;align-items:center;justify-content:center;gap:.55rem;
            background:linear-gradient(135deg,rgba(255,214,0,.15) 0%,rgba(255,152,0,.1) 100%);
            border:1px solid rgba(255,214,0,.45);
            border-radius:40px;
            padding:.7rem 1.6rem;
            color:#ffe57f;
            font-family:'Inter',sans-serif;
            font-size:.9rem;font-weight:500;
            cursor:pointer;
            box-shadow:0 4px 16px rgba(255,193,7,.2),inset 0 1px 0 rgba(255,255,255,.15);
            backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
            transition:all .3s cubic-bezier(.175,.885,.32,1.275);
            outline:none;
        }
        .btn-cycle:hover{
            transform:translateY(-2px) scale(1.04);
            background:linear-gradient(135deg,rgba(255,214,0,.25) 0%,rgba(255,152,0,.18) 100%);
            border-color:rgba(255,214,0,.75);
            box-shadow:0 6px 24px rgba(255,193,7,.35);
            color:#fff;
        }
        .btn-cycle:active{
            transform:translateY(1px) scale(.97);
        }
        .btn-cycle .icon{
            display:inline-block;transition:transform .4s ease;
        }
        .btn-cycle:hover .icon{
            transform:rotate(45deg) scale(1.15);
        }

        /* Botón sutil para volver a Vista 1 si se desea */
        .btn-back-link{
            background:none;border:none;color:rgba(255,214,0,.45);
            font-size:.78rem;font-family:'Inter',sans-serif;
            cursor:pointer;margin-top:.4rem;padding:.2rem .5rem;
            transition:color .2s ease;
        }
        .btn-back-link:hover{color:#ffd700;text-decoration:underline}

        /* ── FOOTER SUTIL ── */
        .footer-note{
            position:fixed;bottom:.6rem;left:50%;transform:translateX(-50%);
            font-size:.65rem;color:rgba(255,214,0,.2);letter-spacing:.1em;
            z-index:5;pointer-events:none;white-space:nowrap;
        }

        /* ── RESPONSIVE DESIGN (MOBILE FIRST) ── */
        @media(max-width:380px){
            .v1-card{padding:2.2rem 1.4rem}
            .v1-text{font-size:1.15rem;line-height:1.6}
            .btn-discover{padding:.85rem 1.7rem;font-size:.92rem}
            .v2-quote-card{padding:1.2rem 1rem;margin-top:-5px}
            .v2-quote-text{font-size:.95rem;min-height:4.2rem}
        }
        @media(min-width:768px){
            .v1-card{padding:3.2rem 2.8rem}
            .v1-text{font-size:1.55rem;line-height:1.8}
            .btn-discover{padding:1.1rem 2.6rem;font-size:1.05rem}
            .v2-sunflower-svg{width:360px;height:360px}
            .v2-quote-card{padding:1.8rem 1.6rem;margin-top:-10px;max-width:440px}
            .v2-quote-text{font-size:1.1rem}
        }
        /* Mobile Landscape */
        @media(orientation:landscape) and (max-height:500px){
            body{padding:.3rem;align-items:center}
            .view-container{min-height:92vh;max-width:92%}
            .v1-card{padding:1.4rem 2rem}
            .v1-text{font-size:1.05rem;line-height:1.5;margin-bottom:1rem}
            .v1-flower-decor{margin-bottom:.8rem}
            .btn-discover{padding:.65rem 1.8rem;font-size:.88rem}

            /* Vista 2 en Landscape: Layout lado a lado */
            .v2-sunflower-stage{
                flex-direction:row;align-items:center;justify-content:center;
                gap:2rem;min-height:90vh;
            }
            .v2-sunflower-svg{
                width:min(50vmin, 220px);height:min(50vmin, 220px);
            }
            .v2-stem-svg{display:none} /* Ocultar tallo largo en landscape para mantener orden limpio */
            .v2-quote-card{
                margin-top:0;width:55%;max-width:420px;
                padding:1.2rem 1.2rem;gap:.7rem;
            }
            .v2-quote-text{font-size:.95rem;line-height:1.5;min-height:3.6rem}
            .btn-cycle{padding:.55rem 1.3rem;font-size:.82rem}
        }

        @media(prefers-reduced-motion:reduce){
            *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
            .fp{display:none!important}
        }

        /* ── Modal Final ── */
        .final-modal-overlay {
            position:fixed;inset:0;
            background:rgba(5,9,20,.8);
            backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
            z-index:99999;
            display:flex;align-items:center;justify-content:center;
            opacity:0;pointer-events:none;
            transition:opacity .5s ease;
        }
        .final-modal-overlay.show {
            opacity:1;pointer-events:auto;
        }
        .final-modal-content {
            background:rgba(12,16,40,.85);
            border:1px solid rgba(255,214,0,.4);
            border-radius:24px;
            padding:2.8rem 2rem;
            text-align:center;
            max-width:90%;width:380px;
            box-shadow:0 15px 45px rgba(0,0,0,.6),0 0 60px rgba(255,214,0,.15),inset 0 1px 0 rgba(255,255,255,.1);
            transform:scale(.9) translateY(20px);
            transition:transform .5s cubic-bezier(.4,0,.2,1);
        }
        .final-modal-overlay.show .final-modal-content {
            transform:scale(1) translateY(0);
        }
        .final-modal-content h2 {
            font-size:3rem;margin:0 0 1.2rem;
            animation:heartbeat 2s infinite ease-in-out;
        }
        .final-modal-content p {
            font-family:'Playfair Display',serif;
            font-size:1.6rem;font-weight:600;
            color:#ffd700;
            margin:0 0 2.5rem;
            line-height:1.4;
        }
    </style>
</head>
<body>
    <div class="bg"></div>
    <div class="stars" id="stars"></div>
    <div class="rain" id="rain"></div>

    <!-- Definiciones SVG Compartidas (Gradientes) -->
    <svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
        <defs>
            <linearGradient id="g-ogr" x1="50%" y1="100%" x2="50%" y2="0%">
                <stop offset="0%" stop-color="#E67E00"/>
                <stop offset="30%" stop-color="#FFA000"/>
                <stop offset="70%" stop-color="#FFD54F"/>
                <stop offset="100%" stop-color="#FFF59D"/>
            </linearGradient>
            <linearGradient id="g-mgr" x1="50%" y1="100%" x2="50%" y2="0%">
                <stop offset="0%" stop-color="#EF6C00"/>
                <stop offset="35%" stop-color="#FF8F00"/>
                <stop offset="75%" stop-color="#FFCA28"/>
                <stop offset="100%" stop-color="#FFE082"/>
            </linearGradient>
            <linearGradient id="g-igr" x1="50%" y1="100%" x2="50%" y2="0%">
                <stop offset="0%" stop-color="#D84315"/>
                <stop offset="40%" stop-color="#F57C00"/>
                <stop offset="80%" stop-color="#FFB300"/>
                <stop offset="100%" stop-color="#FFD54F"/>
            </linearGradient>
            <radialGradient id="g-disc" cx="44%" cy="40%">
                <stop offset="0%" stop-color="#6D4C41"/>
                <stop offset="48%" stop-color="#4E342E"/>
                <stop offset="80%" stop-color="#2D1A14"/>
                <stop offset="100%" stop-color="#140A05"/>
            </radialGradient>
            <linearGradient id="g-stem" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#43A047"/>
                <stop offset="50%" stop-color="#2E7D32"/>
                <stop offset="100%" stop-color="#1B5E20"/>
            </linearGradient>
            <linearGradient id="g-leaf" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#66BB6A"/>
                <stop offset="100%" stop-color="#2E7D32"/>
            </linearGradient>
        </defs>
    </svg>

    <main class="view-container">
        <!-- ── VISTA 1: PANTALLA INICIAL ── -->
        <section class="view-1" id="view1" aria-label="Pantalla Inicial">
            <div class="v1-card">
                <!-- Decoración sutil de flores amarillas -->
                <div class="v1-flower-decor" aria-hidden="true">
                    <svg viewBox="-50 -50 100 100">
                        <circle cx="0" cy="0" r="14" fill="#6D4C41"/>
                        <circle cx="0" cy="-28" r="12" fill="#FFCA28"/>
                        <circle cx="28" cy="0" r="12" fill="#FFCA28"/>
                        <circle cx="0" cy="28" r="12" fill="#FFCA28"/>
                        <circle cx="-28" cy="0" r="12" fill="#FFCA28"/>
                        <circle cx="20" cy="-20" r="11" fill="#FFD54F"/>
                        <circle cx="20" cy="20" r="11" fill="#FFD54F"/>
                        <circle cx="-20" cy="20" r="11" fill="#FFD54F"/>
                        <circle cx="-20" cy="-20" r="11" fill="#FFD54F"/>
                    </svg>
                    <svg viewBox="-50 -50 100 100">
                        <circle cx="0" cy="0" r="16" fill="#4E342E"/>
                        <circle cx="0" cy="-30" r="14" fill="#FFB300"/>
                        <circle cx="30" cy="0" r="14" fill="#FFB300"/>
                        <circle cx="0" cy="30" r="14" fill="#FFB300"/>
                        <circle cx="-30" cy="0" r="14" fill="#FFB300"/>
                        <circle cx="21" cy="-21" r="13" fill="#FFCA28"/>

/* ── ESTRELLAS DE FONDO ── */
!function(){
    const c = document.getElementById('stars'), count = isMobile ? 32 : 55;
    for(let i = 0; i < count; i++){
        const s = document.createElement('div');
        s.className = 'star';
        s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${2+Math.random()*4}s;animation-delay:${Math.random()*3}s;width:${1+Math.random()*2}px;height:${1+Math.random()*2}px`;

}();

/* ── LLUVIA INFINITA DE PÉTALOS ── */
const RC = document.getElementById('rain');
let rI = null, rN = 0;
const MAX = isMobile ? 55 : 90, INT = isMobile ? 280 : 180, BURST = isMobile ? 12 : 22;
const COL = ['#FFE082','#FFD740','#FFCA28','#FFC107','#FFB300','#FFF176','#FFEE58','#FFF9C4'];
const SH = [
    c => `<svg width="22" height="26" viewBox="0 0 22 26"><path d="M11 0C11 0 22 6.5 22 14.5C22 20.6 17.1 26 11 26C4.9 26 0 20.6 0 14.5C0 6.5 11 0 11 0Z" fill="${c}"/></svg>`,
    c => `<svg width="14" height="28" viewBox="0 0 14 28"><path d="M7 0C7 0 14 8 14 17C14 22.5 10.9 28 7 28C3.1 28 0 22.5 0 17C0 8 7 0 7 0Z" fill="${c}"/></svg>`,
    c => `<svg width="16" height="18" viewBox="0 0 16 18"><ellipse cx="8" cy="9" rx="8" ry="9" fill="${c}"/></svg>`,
    c => `<svg width="20" height="12" viewBox="0 0 20 12"><path d="M10 0C10 0 20 3 20 7.5C20 10 15.5 12 10 12C4.5 12 0 10 0 7.5C0 3 10 0 10 0Z" fill="${c}"/></svg>`
];

function spawnPetal(){
    if(rN >= MAX) return;
    const e = document.createElement('div');
    e.className = 'fp';
    const c = COL[Math.floor(Math.random() * COL.length)];
    e.innerHTML = SH[Math.floor(Math.random() * SH.length)](c);
    const dur = 6 + Math.random() * 8, dly = Math.random() * 0.4;
    e.style.cssText = `left:${Math.random()*100}%;--t:${dur}s;--w:${dly}s;--s:${.35+Math.random()*.65};--dx:${(Math.random()-.5)*130}px;--r:${(Math.random()-.5)*720}deg;--o:${.25+Math.random()*.5}`;
    RC.appendChild(e);
    rN++;
    requestAnimationFrame(() => e.classList.add('go'));
    setTimeout(() => { e.remove(); rN--; }, (dur + dly) * 1000);
}

function startRain(){
    for(let i = 0; i < BURST; i++) setTimeout(spawnPetal, i * 130);
    rI = setInterval(spawnPetal, INT);
}
startRain();

document.addEventListener('visibilitychange', () => {
    if(document.hidden && rI) { clearInterval(rI); rI = null; }
    else if(!document.hidden && !rI) { rI = setInterval(spawnPetal, INT); }
});

/* ── GENERACIÓN DEL GIRASOL EN SVG (VISTA 2) ── */
!function(){
    const svg = document.getElementById('v2Sunflower');
    if(!svg) return;

    function petalPath(l, w){
        return `M 0 0 C ${-w*0.8} ${-l*0.22} ${-w*1.05} ${-l*0.62} ${-w*0.48} ${-l*0.92} C ${-w*0.16} ${-l*1.03} ${w*0.16} ${-l*1.03} ${w*0.48} ${-l*0.92} C ${w*1.05} ${-l*0.62} ${w*0.8} ${-l*0.22} 0 0`;
    }

    // Capa exterior de pétalos (28 pétalos)
    const n1 = 28, l1 = 205, w1 = 25;
    const p1D = petalPath(l1, w1);
    for(let i = 0; i < n1; i++){
        const a = (360 / n1) * i;
        const g = document.createElementNS(NS, 'g');
        g.setAttribute('transform', `rotate(${a})`);
        const p = document.createElementNS(NS, 'path');
        p.setAttribute('d', p1D);
        p.setAttribute('fill', 'url(#g-ogr)');
        p.setAttribute('stroke', 'rgba(230,126,0,0.25)');
        p.setAttribute('stroke-width', '0.6');
        g.appendChild(p);
        svg.appendChild(g);
    }

    // Capa media de pétalos (28 pétalos desfasados)
    const n2 = 28, l2 = 180, w2 = 22;
    const p2D = petalPath(l2, w2);
    const offset2 = (360 / n2) / 2;
    for(let i = 0; i < n2; i++){
        const a = (360 / n2) * i + offset2;
        const g = document.createElementNS(NS, 'g');
        g.setAttribute('transform', `rotate(${a})`);
        const p = document.createElementNS(NS, 'path');
        p.setAttribute('d', p2D);
        p.setAttribute('fill', 'url(#g-mgr)');
        p.setAttribute('stroke', 'rgba(239,108,0,0.2)');
        p.setAttribute('stroke-width', '0.5');
        g.appendChild(p);
        svg.appendChild(g);
    }

    // Capa interna de pétalos (22 pétalos)
    const n3 = 22, l3 = 145, w3 = 19;
    const p3D = petalPath(l3, w3);
    const offset3 = (360 / n3) / 3;
    for(let i = 0; i < n3; i++){
        const a = (360 / n3) * i + offset3;
        const g = document.createElementNS(NS, 'g');
        g.setAttribute('transform', `rotate(${a})`);
        const p = document.createElementNS(NS, 'path');
        p.setAttribute('d', p3D);
        p.setAttribute('fill', 'url(#g-igr)');
        g.appendChild(p);
        svg.appendChild(g);
    }

    // Disco central
    const disc = document.createElementNS(NS, 'circle');
    disc.setAttribute('cx', '0');
    disc.setAttribute('cy', '0');
    disc.setAttribute('r', '78');
    disc.setAttribute('fill', 'url(#g-disc)');
    disc.setAttribute('stroke', 'rgba(255,160,0,0.25)');
    disc.setAttribute('stroke-width', '1');
    svg.appendChild(disc);

    // Semillas en espiral de Fibonacci (100 semillas)
    const seedCount = 100, goldenAngle = 137.507764 * Math.PI / 180;
    const maxR = 64;
    for(let i = 0; i < seedCount; i++){
        const theta = i * goldenAngle;
        const r = 2 + Math.sqrt(i) * (maxR / Math.sqrt(seedCount));
        if(r > maxR) continue;

        const x = (r * Math.cos(theta)).toFixed(2);
        const y = (r * Math.sin(theta)).toFixed(2);
        const dot = document.createElementNS(NS, 'circle');
        dot.setAttribute('cx', x);
        dot.setAttribute('cy', y);
        dot.setAttribute('r', (0.8 + Math.sqrt(i / seedCount) * 1.1).toFixed(2));
        dot.setAttribute('fill', r > 40 ? 'rgba(255,193,7,0.7)' : (r > 20 ? 'rgba(215,140,20,0.75)' : 'rgba(62,39,35,0.9)'));
        svg.appendChild(dot);
    }

    // Clonar para girasoles pequeños alrededor
    const smallContainer = document.getElementById('smallSunflowers');
    if(smallContainer) {
        const positions = [
            { l: '4%',  t: '14%', s: 0.30, r: -16, d: 0.25 },
            { l: '18%', t: '22%', s: 0.38, r: 15,  d: 0.35 },
            { l: '32%', t: '6%',  s: 0.26, r: -10, d: 0.50 },
            { l: '68%', t: '7%',  s: 0.27, r: 12,  d: 0.45 },
            { l: '82%', t: '22%', s: 0.36, r: -18, d: 0.40 },
            { l: '96%', t: '12%', s: 0.29, r: 20,  d: 0.30 },
            { l: '2%',  t: '38%', s: 0.27, r: 8,   d: 0.60 },
            { l: '12%', t: '48%', s: 0.34, r: -12, d: 0.50 },
            { l: '88%', t: '50%', s: 0.35, r: 15,  d: 0.55 },
            { l: '98%', t: '36%', s: 0.25, r: -15, d: 0.65 },
            { l: '8%',  t: '72%', s: 0.40, r: 22,  d: 0.40 },
            { l: '0%',  t: '86%', s: 0.30, r: -8,  d: 0.70 },
            { l: '92%', t: '74%', s: 0.38, r: -18, d: 0.60 },
            { l: '100%',t: '88%', s: 0.31, r: 16,  d: 0.75 }
        ];
        positions.forEach(pos => {
            const wrap = document.createElement('div');
            wrap.className = 'small-sf-wrap';
            wrap.style.left = pos.l;
            wrap.style.top = pos.t;
            wrap.style.setProperty('--scale', pos.s);
            wrap.style.setProperty('--rot', pos.r + 'deg');
            wrap.style.animationDelay = pos.d + 's, ' + (pos.d + 1.2) + 's';

            // Clone flower
            const clone = svg.cloneNode(true);
            clone.removeAttribute('id');
            clone.setAttribute('class', 'small-sf-flower');
            
            // Stem (más largo, 320px de altura, con hojas orgánicas)
            const stem = document.createElementNS(NS, 'svg');
            stem.setAttribute('class', 'small-sf-stem');
            stem.setAttribute('viewBox', '0 0 50 320');
            stem.innerHTML = `
                <path d="M25,0 C18,100 32,210 25,320" stroke="url(#g-stem)" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-dasharray="350" stroke-dashoffset="350" style="animation:stemDraw 1.1s ${pos.d + 0.1}s ease-out forwards" />
                <path d="M25,65 C14,55 6,67 4,80 C14,85 22,79 25,71 Z" fill="url(#g-leaf)" class="v2-leaf" style="animation-delay:${pos.d + 0.35}s"/>
                <path d="M25,145 C36,135 44,147 46,160 C36,165 28,159 25,151 Z" fill="url(#g-leaf)" class="v2-leaf" style="animation-delay:${pos.d + 0.55}s"/>
                <path d="M25,225 C14,215 6,227 4,240 C14,245 22,239 25,231 Z" fill="url(#g-leaf)" class="v2-leaf" style="animation-delay:${pos.d + 0.75}s"/>
                <path d="M25,285 C36,275 44,287 46,300 C36,305 28,299 25,291 Z" fill="url(#g-leaf)" class="v2-leaf" style="animation-delay:${pos.d + 0.9}s"/>
            `;

            wrap.appendChild(stem);
            wrap.appendChild(clone);
            smallContainer.appendChild(wrap);
        });
    }
}();

/* ── LÓGICA DE TRANSICIÓN Y CICLO DE FRASES ── */
const view1 = document.getElementById('view1');
const view2 = document.getElementById('view2');
const btnDiscover = document.getElementById('btnDiscover');
const btnCycle = document.getElementById('btnCycle');
const btnBack = document.getElementById('btnBack');
const quoteText = document.getElementById('quoteText');

let availableIndices = [];

function getRandomPhrase(){
    if (availableIndices.length === 0) {
        // Refill array with all indices
        for (let i = 0; i < FRASES.length; i++) {
            availableIndices.push(i);
        }
        // Shuffle array (Fisher-Yates)
        for (let i = availableIndices.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [availableIndices[i], availableIndices[j]] = [availableIndices[j], availableIndices[i]];
        }
    }
    const idx = availableIndices.pop();
    return FRASES[idx];
}

function displayNewPhrase(){
    quoteText.classList.remove('fade-in-up');
    quoteText.classList.add('fade-out');

    setTimeout(() => {
        quoteText.textContent = getRandomPhrase();
        quoteText.classList.remove('fade-out');
        quoteText.classList.add('fade-in-up');
    }, 240);
}

// Transición Vista 1 -> Vista 2
btnDiscover.addEventListener('click', () => {
    view1.classList.add('hide');

    setTimeout(() => {
        view1.style.display = 'none';
        view2.style.display = 'flex';
        // Seleccionar frase inicial
        quoteText.textContent = getRandomPhrase();
        quoteText.classList.add('fade-in-up');

        requestAnimationFrame(() => {
            view2.classList.add('show');
        });
    }, 550);
});

// Toast Alert Logic
let phrasesRead = 0;
const toast = document.getElementById('toast');
let toastTimer;
function showToast() {
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
        toast.classList.remove('show');
    }, 3500);
}

// Ciclo de frases al tocar "Leer otra"
const finalModal = document.getElementById('finalModal');
const btnCloseModal = document.getElementById('btnCloseModal');

btnCloseModal.addEventListener('click', () => {
    finalModal.classList.remove('show');
});

btnCycle.addEventListener('click', () => {
    if (availableIndices.length === 0) {
        finalModal.classList.add('show');
    }

    btnCycle.style.pointerEvents = 'none';
    phrasesRead++;
    if(phrasesRead % 10 === 0) {
        showToast();
    }
    displayNewPhrase();
    setTimeout(() => {
        btnCycle.style.pointerEvents = 'auto';
    }, 450);
});

// Volver a Vista 1
btnBack.addEventListener('click', () => {
    view2.classList.remove('show');
    setTimeout(() => {
        view2.style.display = 'none';
        view1.style.display = 'flex';
        requestAnimationFrame(() => {
            view1.classList.remove('hide');
        });
    }, 550);
});
</script>
